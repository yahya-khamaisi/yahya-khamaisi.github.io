    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap"
      rel="stylesheet"
    />
    <title>Yahya Khamayseh</title>
    <script>
      // Own scroll position — Safari otherwise restores a stale offset on
      // reload / tab reopen and the page opens mid-way down.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
    </script>
    <script>
      // Single Page Apps for GitHub Pages — restore the path that 404.html encoded.
      // https://github.com/rafgraph/spa-github-pages  (MIT)
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
    <script>
      // Set language + direction before paint to avoid an RTL flash.
      (function () {
        try {
          var stored = localStorage.getItem('lang-preference')
          var lang =
            stored === 'ar' || stored === 'en'
              ? stored
              : (navigator.languages || [navigator.language]).some(function (l) {
                  return l && l.toLowerCase().indexOf('ar') === 0
                })
              ? 'ar'
              : 'en'
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
        } catch (e) {}
      })()
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-preference')
          var pref =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.themePreference = pref
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <script>
      // Text size + typeface preference, applied before paint.
      (function () {
        try {
          var s = localStorage.getItem('font-size-preference')
          if (s === 'small' || s === 'large')
            document.documentElement.dataset.fontSize = s
          var f = localStorage.getItem('font-family-preference')
          document.documentElement.dataset.font =
            f === 'editorial' || f === 'compact' ? f : 'modern'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
